<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customizable Breathing Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1e1e1e;
      font-family: 'Open Sans', Arial, sans-serif;
      color: #e0e0e0;
    }

    .timer-container {
      text-align: center;
    }

    .phase {
      font-size: 2rem;
      margin-bottom: 20px;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
    }

    .circle {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background-color: transparent;
      border: 10px solid #e0e0e0;
      transform: scale(0.8);
      transition: transform 1s ease-in-out;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
    }

    .circle.inhale {
      transform: scale(1.12);
    }

    .circle.exhale {
      transform: scale(0.8);
    }

    .circle span {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    .controls button {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 1rem;
      font-family: 'Open Sans', Arial, sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .start-button {
      background-color: #2ecc71;
      color: #1e1e1e;
    }

    .start-button:hover {
      background-color: #27ae60;
    }

    .pause-button {
      background-color: #34495e;
      color: #ffffff;
    }

    .pause-button:hover {
      background-color: #2c3e50;
    }

    .reset-button {
      background-color: #8e44ad;
      color: #ffffff;
    }

    .reset-button:hover {
      background-color: #732d91;
    }

    .slider-container {
      margin-bottom: 20px;
      color: #e0e0e0;
      font-family: 'Open Sans', Arial, sans-serif;
    }

    .slider {
      margin: 10px 0;
    }

    .slider-container label {
      display: block;
      margin-bottom: 10px;
    }

    .total-duration {
      font-size: 1.25rem;
      margin-bottom: 20px;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="timer-container">
    <div class="phase" id="phase-display">Get Ready</div>
    <div class="circle" id="circle">
      <span id="circle-timer"></span>
    </div>
    <div class="slider-container">
      <label for="inhale-duration">Inhale Duration: <span id="inhale-value">4.0</span>s</label>
      <input id="inhale-duration" class="slider" type="range" min="3.0" max="5.0" step="0.1" value="4.0">

      <label for="exhale-duration">Exhale Duration: <span id="exhale-value">6.0</span>s</label>
      <input id="exhale-duration" class="slider" type="range" min="5.0" max="7.5" step="0.1" value="6.0">
    </div>
    <div class="total-duration" id="total-duration-display">Remaining Time: 5:00.0</div>
    <div class="controls">
      <button class="start-button" id="start-button">Start</button>
      <button class="pause-button" id="pause-button" style="display: none;">Pause</button>
      <button class="reset-button" id="reset-button" style="display: none;">Reset</button>
    </div>
  </div>

  <script>
    let inhaleDuration = 4.0;
    let exhaleDuration = 6.0;
    const totalSessionTime = 300.0; // 5 minutes in seconds
    let remainingSessionTime = totalSessionTime;
    let phaseIndex = -1;
    let timeLeft = 0;
    let timerInterval;
    let isRunning = false;

    const phaseDisplay = document.getElementById('phase-display');
    const circle = document.getElementById('circle');
    const circleTimer = document.getElementById('circle-timer');
    const totalDurationDisplay = document.getElementById('total-duration-display');
    const startButton = document.getElementById('start-button');
    const pauseButton = document.getElementById('pause-button');
    const resetButton = document.getElementById('reset-button');
    const inhaleSlider = document.getElementById('inhale-duration');
    const exhaleSlider = document.getElementById('exhale-duration');
    const inhaleValue = document.getElementById('inhale-value');
    const exhaleValue = document.getElementById('exhale-value');

    inhaleSlider.addEventListener('input', () => {
      inhaleDuration = parseFloat(inhaleSlider.value);
      inhaleValue.textContent = inhaleSlider.value;
    });

    exhaleSlider.addEventListener('input', () => {
      exhaleDuration = parseFloat(exhaleSlider.value);
      exhaleValue.textContent = exhaleSlider.value;
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const tenths = Math.floor((seconds % 1) * 10);
      return `${mins}:${String(secs).padStart(2, '0')}.${tenths}`;
    }

    function updateCircleTransitionDuration(duration) {
      circle.style.transition = `transform ${duration}s ease-in-out`;
    }

    function updateDisplay() {
      if (phaseIndex === -1) {
        phaseDisplay.textContent = 'Get Ready';
        circle.className = 'circle';
        circleTimer.textContent = '';
        totalDurationDisplay.textContent = 'Remaining Time: ' + formatTime(remainingSessionTime);
      } else {
        const currentPhase = phaseIndex % 2 === 0 ? 'Inhale' : 'Exhale';
        const currentDuration = phaseIndex % 2 === 0 ? inhaleDuration : exhaleDuration;
        phaseDisplay.textContent = currentPhase;
        circle.className = `circle ${currentPhase.toLowerCase()}`;
        circleTimer.textContent = formatTime(timeLeft);
        totalDurationDisplay.textContent = 'Remaining Time: ' + formatTime(remainingSessionTime);
        updateCircleTransitionDuration(currentDuration);
      }
    }

    function playSound(phase) {
      const sounds = {
        inhale: 'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/juLIYuEYre10CvC03A1h/pub/J8mip7lBT6vgAWHXPxTQ.mp3',
        exhale: 'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/juLIYuEYre10CvC03A1h/pub/uJ4wEJfrddhk0AfgjR3x.mp3'
      };
      const audio = new Audio(sounds[phase]);
      audio.play();
    }

    function nextPhase() {
      phaseIndex = (phaseIndex + 1) % 2; // Alternate between inhale and exhale
      const currentPhase = phaseIndex === 0 ? 'inhale' : 'exhale';
      timeLeft = phaseIndex === 0 ? inhaleDuration : exhaleDuration;
      playSound(currentPhase);
      updateDisplay();
    }

    function startTimer() {
      if (isRunning) return;

      isRunning = true;
      startButton.style.display = 'none';
      pauseButton.style.display = 'inline-block';
      resetButton.style.display = 'inline-block';

      if (phaseIndex === -1) {
        phaseIndex = 0;
        timeLeft = inhaleDuration;
        playSound('inhale');
        updateDisplay();
        startBreathingTimer();
      } else {
        startBreathingTimer();
      }
    }

    function startBreathingTimer() {
      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        remainingSessionTime -= 0.1;

        if (remainingSessionTime <= 0) {
          clearInterval(timerInterval);
          isRunning = false;
          phaseDisplay.textContent = 'Session Complete';
          startButton.style.display = 'inline-block';
          pauseButton.style.display = 'none';
          resetButton.style.display = 'none';
          return;
        }

        if (timeLeft <= 0) {
          nextPhase();
        }

        updateDisplay();
      }, 100);
    }

    function pauseTimer() {
      if (!isRunning) return;

      isRunning = false;
      clearInterval(timerInterval);
      pauseButton.style.display = 'none';
      startButton.textContent = 'Resume';
      startButton.style.display = 'inline-block';
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      phaseIndex = -1;
      timeLeft = 0;
      remainingSessionTime = totalSessionTime;
      updateDisplay();
      startButton.textContent = 'Start';
      startButton.style.display = 'inline-block';
      pauseButton.style.display = 'none';
      resetButton.style.display = 'none';
    }

    startButton.addEventListener('click', startTimer);
    pauseButton.addEventListener('click', pauseTimer);
    resetButton.addEventListener('click', resetTimer);

    updateDisplay();
  </script>
</body>
</html>
